<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Записи · Шумомер</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/static/common.js"></script>
  <style>
    canvas { display: block; width: 100%; }
    @media print { canvas { break-inside: avoid; } }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased print:bg-white print:text-black">
  <div class="mx-auto max-w-7xl space-y-4 px-4 py-4 sm:py-6">

    <header class="flex flex-wrap items-center justify-between gap-3 print:hidden">
      <div class="flex flex-wrap items-center gap-x-6 gap-y-2">
        <div>
          <h1 class="text-xl font-semibold tracking-tight sm:text-2xl">Шумомер</h1>
          <p class="text-sm text-slate-400">Записани измервания</p>
        </div>
        <nav class="flex gap-1 rounded-lg bg-slate-900 p-1 text-sm ring-1 ring-slate-800">
          <a href="/" class="rounded-md px-3 py-1.5 text-slate-400 hover:text-slate-100">На живо</a>
          <a href="/sessions" class="rounded-md bg-slate-700 px-3 py-1.5 font-medium">Записи</a>
        </nav>
      </div>
    </header>

    <div id="error" class="hidden rounded-xl bg-red-950/60 px-4 py-3 text-sm text-red-200 ring-1 ring-red-900"></div>

    <div class="grid gap-4 lg:grid-cols-3">
      <aside class="space-y-2 print:hidden">
        <h2 class="px-1 text-sm font-semibold uppercase tracking-wider text-slate-400">Записи</h2>
        <div id="list" class="space-y-2"></div>
      </aside>

      <main id="report" class="space-y-4 lg:col-span-2">
        <div class="rounded-2xl bg-slate-900/70 p-8 text-center text-slate-400 ring-1 ring-slate-800">
          Избери запис отляво.
        </div>
      </main>
    </div>
  </div>

  <template id="report-template">
    <section class="rounded-2xl bg-slate-900/70 p-4 ring-1 ring-slate-800 sm:p-6 print:bg-white print:p-0 print:ring-0">
      <div class="flex flex-wrap items-start justify-between gap-3">
        <div class="min-w-0">
          <h2 data-f="name" class="break-words text-2xl font-semibold"></h2>
          <p data-f="meta" class="mt-1 text-sm text-slate-400 print:text-slate-600"></p>
        </div>
        <div class="flex flex-wrap gap-2 text-sm print:hidden">
          <button data-a="rename" class="rounded-lg bg-slate-800 px-3 py-2 ring-1 ring-slate-700 hover:bg-slate-700">Преименувай</button>
          <a data-a="csv" class="rounded-lg bg-slate-800 px-3 py-2 ring-1 ring-slate-700 hover:bg-slate-700">CSV</a>
          <button data-a="print" class="rounded-lg bg-slate-800 px-3 py-2 ring-1 ring-slate-700 hover:bg-slate-700">Печат</button>
          <button data-a="delete" class="rounded-lg bg-red-950/60 px-3 py-2 text-red-200 ring-1 ring-red-900 hover:bg-red-900/60">Изтрий</button>
        </div>
      </div>
      <div data-f="empty" class="mt-6 hidden text-slate-400">Още няма измервания в този запис.</div>
      <dl data-f="tiles" class="mt-6 grid grid-cols-2 gap-4 sm:grid-cols-3 md:grid-cols-5"></dl>
      <p data-f="lowfreq" class="mt-4 hidden text-sm"></p>
    </section>

    <section data-f="charts" class="space-y-4">
      <div class="rounded-2xl bg-slate-900/70 p-4 ring-1 ring-slate-800 print:bg-white print:ring-slate-300">
        <h3 class="mb-3 text-sm font-semibold text-slate-300 print:text-black">LAeq (1 s) във времето <span class="font-normal text-slate-500">· тънката линия е LAFmax, червеното – събития от алармата</span></h3>
        <canvas data-f="timeline" class="h-56 sm:h-64"></canvas>
      </div>
      <div class="grid gap-4 md:grid-cols-2">
        <div class="rounded-2xl bg-slate-900/70 p-4 ring-1 ring-slate-800 print:bg-white print:ring-slate-300">
          <h3 class="mb-3 text-sm font-semibold text-slate-300 print:text-black">Време над праг</h3>
          <div data-f="above" class="space-y-2.5 text-sm"></div>
        </div>
        <div class="rounded-2xl bg-slate-900/70 p-4 ring-1 ring-slate-800 print:bg-white print:ring-slate-300">
          <h3 class="mb-3 text-sm font-semibold text-slate-300 print:text-black">Разпределение на LAeq <span class="font-normal text-slate-500">(% от времето)</span></h3>
          <canvas data-f="histogram" class="h-48"></canvas>
        </div>
      </div>
    </section>

    <section class="rounded-2xl bg-slate-900/70 p-4 ring-1 ring-slate-800 print:bg-white print:ring-slate-300">
      <h3 class="mb-3 text-sm font-semibold text-slate-300 print:text-black">Събития от алармата</h3>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="text-slate-400">
            <tr><th class="py-1.5 pr-4 font-medium">Начало</th><th class="py-1.5 pr-4 font-medium">Продълж.</th><th class="py-1.5 pr-4 font-medium">Праг</th><th class="py-1.5 font-medium">Макс.</th></tr>
          </thead>
          <tbody data-f="events" class="divide-y divide-slate-800 tabular-nums"></tbody>
        </table>
      </div>
    </section>
  </template>

<script>
let sessions = [];
let current = null;       // id на отворения запис
let report = null;
let charts = null;

const selectedId = () => parseInt(location.hash.slice(1), 10) || null;

async function loadList() {
  try {
    ({ sessions } = await api('/api/sessions'));
  } catch (e) {
    showError(e.message);
    return;
  }
  const list = $('list');
  list.innerHTML = '';
  if (!sessions.length) {
    list.innerHTML = '<div class="rounded-xl bg-slate-900/70 p-4 text-sm text-slate-400 ring-1 ring-slate-800">Още няма записи. Започни от страницата „На живо“.</div>';
  }
  for (const s of sessions) {
    const a = document.createElement('a');
    a.href = `#${s.id}`;
    a.className = 'block rounded-xl p-3 ring-1 transition ' +
      (s.id === current ? 'bg-slate-800 ring-sky-600' : 'bg-slate-900/70 ring-slate-800 hover:bg-slate-800/70');
    a.innerHTML = `
      <div class="flex items-center justify-between gap-2">
        <span class="truncate font-medium"></span>
        <span class="shrink-0 text-lg font-semibold tabular-nums"></span>
      </div>
      <div class="mt-0.5 flex items-center justify-between gap-2 text-xs text-slate-400">
        <span></span><span class="tabular-nums"></span>
      </div>`;
    const [name, leq] = a.children[0].children;
    const [date, dur] = a.children[1].children;
    name.textContent = s.name;
    leq.textContent = s.laeq === null ? '--' : `${s.laeq.toFixed(1)}`;
    leq.style.color = levelColor(s.laeq ?? NaN);
    date.textContent = fmtDateTime(s.started_at);
    dur.textContent = s.active ? `● запис · ${fmtDuration(s.duration)}` : fmtDuration(s.duration);
    if (s.active) dur.classList.add('text-red-400');
    list.appendChild(a);
  }
}

async function openSession(id) {
  current = id;
  if (!id) {
    report = null;
    $('report').innerHTML = '<div class="rounded-2xl bg-slate-900/70 p-8 text-center text-slate-400 ring-1 ring-slate-800">Избери запис отляво.</div>';
    loadList();
    return;
  }
  try {
    report = await api(`/api/sessions/${id}`);
  } catch (e) {
    showError(e.message);
    location.hash = '';
    return;
  }
  showError('');
  renderReport();
  loadList();
}

function tile(label, value, hint) {
  const d = document.createElement('div');
  d.innerHTML = '<dt class="text-xs text-slate-400 print:text-slate-600"></dt><dd class="text-2xl font-semibold tabular-nums"></dd>';
  d.children[0].textContent = label;
  d.children[0].title = hint || '';
  d.children[1].textContent = fmtDb(value);
  d.children[1].style.color = levelColor(value);
  return d;
}

function renderReport() {
  const { session, summary } = report;
  const root = $('report-template').content.cloneNode(true);
  const f = (name) => root.querySelector(`[data-f="${name}"]`);
  const a = (name) => root.querySelector(`[data-a="${name}"]`);

  f('name').textContent = session.name;
  const end = session.ended_at ? fmtDateTime(session.ended_at) : 'записва се…';
  f('meta').textContent = `${fmtDateTime(session.started_at)} – ${end} · ${fmtDuration(report.duration)}` +
    ` · офсет ${session.calibration_offset} dB` + (session.device ? ` · ${session.device}` : '');

  a('csv').href = `/api/sessions/${session.id}/csv`;
  a('print').addEventListener('click', () => window.print());
  a('rename').addEventListener('click', renameSession);
  a('delete').addEventListener('click', deleteSession);
  if (report.active) a('delete').classList.add('hidden');

  if (!summary) {
    f('empty').classList.remove('hidden');
    f('charts').classList.add('hidden');
  } else {
    const tiles = f('tiles');
    tiles.append(
      tile('LAeq', summary.laeq, 'Еквивалентно непрекъснато A-претеглено ниво за целия запис'),
      tile('LAFmax', summary.lafmax),
      tile('LAFmin', summary.lafmin),
      tile('LCeq', summary.lceq),
      tile('LZpeak', summary.lzpeak, 'Най-високият моментен пик, без претегляне'),
      tile('L10', summary.l10, 'Нивото, надвишено 10% от времето (шумни моменти)'),
      tile('L50', summary.l50, 'Медиана'),
      tile('L90', summary.l90, 'Нивото, надвишено 90% от времето (фонов шум)'),
      tile('LZeq', summary.lzeq),
    );
    const diff = summary.lceq - summary.laeq;
    const lf = f('lowfreq');
    lf.classList.remove('hidden');
    lf.className = 'mt-4 text-sm ' + (diff > 15 ? 'text-amber-300' : 'text-slate-400');
    lf.textContent = `LCeq − LAeq = ${diff.toFixed(1)} dB. ` + (diff > 15
      ? 'Голямата разлика означава много нискочестотен шум (бучене, вентилация, бас).'
      : 'Няма изразен нискочестотен шум.');

    const total = summary.seconds;
    for (const row of report.above) {
      const pct = total ? (100 * row.seconds) / total : 0;
      const el = document.createElement('div');
      el.innerHTML = `
        <div class="mb-1 flex justify-between gap-2"><span></span><span class="tabular-nums text-slate-400"></span></div>
        <div class="h-2 overflow-hidden rounded-full bg-slate-800 print:bg-slate-200"><div class="h-full rounded-full"></div></div>`;
      el.querySelector('span').textContent = `≥ ${row.threshold} dB`;
      el.querySelectorAll('span')[1].textContent = `${fmtDuration(row.seconds)} · ${pct.toFixed(1)}%`;
      const bar = el.querySelector('.h-full');
      bar.style.width = `${pct}%`;
      bar.style.background = levelColor(row.threshold + 0.1);
      f('above').appendChild(el);
    }
  }

  const tbody = f('events');
  if (!report.events.length) {
    tbody.innerHTML = '<tr><td colspan="4" class="py-2 text-slate-500">Няма събития</td></tr>';
  }
  for (const e of [...report.events].reverse()) {
    const tr = document.createElement('tr');
    const dur = e.ended_at ? fmtDuration(e.ended_at - e.started_at) : 'продължава';
    for (const text of [fmtDateTime(e.started_at), dur, `${e.threshold} dB`, `${fmtDb(e.max_level)} dB`]) {
      const td = document.createElement('td');
      td.className = 'py-1.5 pr-4';
      td.textContent = text;
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }

  $('report').innerHTML = '';
  $('report').appendChild(root);

  if (summary) {
    const draw = () => { drawTimeline(); drawHistogram(); };
    charts = {
      timeline: setupCanvas($('report').querySelector('[data-f="timeline"]'), () => charts && draw()),
      histogram: setupCanvas($('report').querySelector('[data-f="histogram"]'), () => charts && draw()),
    };
    draw();
  } else {
    charts = null;
  }
}

function drawTimeline() {
  const { ctx, w, h } = charts.timeline;
  const { series, session, events } = report;
  ctx.clearRect(0, 0, w, h);
  const box = { L: 36, T: 8, pw: w - 44, ph: h - 28 };
  const t0 = session.started_at;
  const t1 = Math.max(session.ended_at || Date.now() / 1000, series.t[series.t.length - 1], t0 + 1);
  const x = (t) => box.L + box.pw * ((t - t0) / (t1 - t0));
  const { lo, hi } = levelRange([...series.laeq, ...series.lafmax]);

  // Събитията от алармата като червени ивици отдолу
  ctx.fillStyle = 'rgba(248, 113, 113, 0.18)';
  for (const e of events) {
    const xa = x(e.started_at), xb = x(e.ended_at || t1);
    ctx.fillRect(xa, box.T, Math.max(2, xb - xa), box.ph);
  }
  const y = drawLevelGrid(ctx, box, lo, hi);

  ctx.textBaseline = 'top';
  for (let i = 0; i <= 4; i++) {
    const t = t0 + ((t1 - t0) * i) / 4;
    ctx.textAlign = i === 0 ? 'left' : i === 4 ? 'right' : 'center';
    ctx.fillText(fmtTime(t), x(t), h - 14);
  }

  const line = (values, color, width) => {
    ctx.beginPath();
    values.forEach((v, i) => (i ? ctx.lineTo(x(series.t[i]), y(v)) : ctx.moveTo(x(series.t[i]), y(v))));
    ctx.strokeStyle = color; ctx.lineWidth = width; ctx.stroke();
  };
  line(series.lafmax, 'rgba(148, 163, 184, 0.45)', 1);
  line(series.laeq, '#38bdf8', 1.5);
}

function drawHistogram() {
  const { ctx, w, h } = charts.histogram;
  const { edges, counts } = report.histogram;
  ctx.clearRect(0, 0, w, h);
  const box = { L: 32, T: 8, pw: w - 40, ph: h - 28 };
  const total = counts.reduce((a, b) => a + b, 0) || 1;
  const pcts = counts.map((c) => (100 * c) / total);
  const top = Math.max(10, Math.ceil(Math.max(...pcts) / 10) * 10);
  const y = (p) => box.T + box.ph * (1 - p / top);

  ctx.font = FONT; ctx.lineWidth = 1;
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (let p = 0; p <= top; p += top / 2) {
    ctx.strokeStyle = GRID;
    ctx.beginPath(); ctx.moveTo(box.L, y(p)); ctx.lineTo(box.L + box.pw, y(p)); ctx.stroke();
    ctx.fillStyle = LABEL; ctx.fillText(`${p}%`, box.L - 6, y(p));
  }

  const n = counts.length;
  const slot = box.pw / n;
  const labelEvery = Math.ceil(n / 8);
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  pcts.forEach((p, i) => {
    const mid = (edges[i] + edges[i + 1]) / 2;
    ctx.fillStyle = levelColor(mid);
    ctx.fillRect(box.L + slot * i + 1, y(p), Math.max(1, slot - 2), box.T + box.ph - y(p));
    if (i % labelEvery === 0) { ctx.fillStyle = LABEL; ctx.fillText(edges[i], box.L + slot * i, h - 14); }
  });
}

async function renameSession() {
  const name = prompt('Ново име на записа:', report.session.name);
  if (!name || !name.trim()) return;
  try {
    await api(`/api/sessions/${current}`, { name: name.trim() }, 'PATCH');
    openSession(current);
  } catch (e) {
    showError(e.message);
  }
}

async function deleteSession() {
  if (!confirm(`Да изтрия ли „${report.session.name}“? Това не може да се върне.`)) return;
  try {
    await api(`/api/sessions/${current}`, undefined, 'DELETE');
    location.hash = '';
  } catch (e) {
    showError(e.message);
  }
}

window.addEventListener('hashchange', () => openSession(selectedId()));

// Активният запис се опреснява на всеки 5 секунди
setInterval(() => {
  if (report?.active && !document.hidden) openSession(current);
  else if (sessions.some((s) => s.active)) loadList();
}, 5000);

openSession(selectedId());
</script>
</body>
</html>
